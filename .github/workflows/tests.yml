name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      # Any analyzer issue (including infos) fails the build; the codebase
      # is kept at zero.
      - run: flutter analyze

      - run: flutter test
