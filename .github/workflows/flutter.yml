name: Flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed lib test

      # Warnings and errors fail the build. Infos stay non-fatal so the
      # RadioGroup deprecation (needs Flutter 3.35+) doesn't force an SDK
      # bump on everyone building the app.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test
